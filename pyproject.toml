[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-control"
version = "0.3.4"
description = "LAN control dashboard for Linux desktops, including Niri and Dux Shell"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psutil>=6.0",
]

[project.scripts]
nexus-control = "app.main:run"

[project.optional-dependencies]
desktop = ["PySide6>=6.7"]

[project.gui-scripts]
nexus-control-desktop = "app.desktop:run_desktop"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["integrations*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.setuptools.package-data]
app = ["static/*"]
